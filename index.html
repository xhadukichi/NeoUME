<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UME Neo">
<title>アウトラインエディタ</title>
<link rel="icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="toolbar">
    <button id="btnNew">新規</button>
    <button id="btnOpen">開く</button>
    <button id="btnSave">保存</button>
    <button id="btnCopy">コピー</button>
    <button id="btnCut">カット</button>
    <button id="btnPaste">ペースト</button>
    <button id="btnSearch" type="button" aria-label="検索">🔍</button>
    <button id="btnAbout" type="button" aria-label="アプリ情報">？</button>
    <button id="btnFontSize">文字サイズ: 20px</button>
    <label class="theme-toggle" title="表示モード">
      <span aria-hidden="true">☀️</span>
      <input id="themeToggle" type="checkbox" role="switch" aria-label="ダークテーマ">
      <span aria-hidden="true">🌙</span>
    </label>
    <span id="fileNameDisplay">無題.txt</span>
  </div>
  <section id="searchPanel" role="search" aria-label="検索" hidden>
    <div class="searchRow">
      <label for="searchInput">検索ワード</label>
    <input id="searchInput" type="search" autocomplete="off">
      <button id="searchPrevious" type="button">↑前検索</button>
    </div>
    <div class="searchRow">
      <label for="replaceInput">置換ワード</label>
      <input id="replaceInput" type="text" autocomplete="off">
      <button id="searchNext" type="button">↓次検索</button>
    </div>
    <div class="searchActions">
      <button id="replaceCurrent" type="button">置換実行</button>
      <button id="searchClose" type="button">キャンセル</button>
    </div>
    <div id="searchMessage" role="status" aria-live="polite"></div>
  </section>
  <div id="spacer"></div>

  <div id="mainArea">
    <div id="outlineArea"><div id="outlineEmpty">見出し（# ）がここに表示されます</div></div>

    <div id="editorWrapper">
      <div id="currentLineLayer"></div>
      <div id="highlightLayer" class="editorFont"></div>
      <div id="caretMirror" class="editorFont"></div>
      <textarea id="editorTextarea" class="editorFont" spellcheck="false"></textarea>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".txt,.md" style="display:none;">

  <div id="modalOverlay">
    <div id="modalBox">
      <div id="modalMessage"></div>
      <div id="modalButtons">
        <button id="modalCancel">キャンセル</button>
        <button id="modalOk">OK</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <div id="aboutOverlay" class="aboutOverlay" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="aboutBox">
      <h2 id="aboutTitle">UME Neo</h2>
      <p>アウトラインエディタ</p>
      <p>バージョン <span id="aboutVersion"></span></p>
      <button id="aboutClose" type="button">閉じる</button>
    </div>
  </div>

<script type="module" src="/main.ts"></script>
</body>
</html>
