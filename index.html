<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neo UME">
<title>Neo UMEditor</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="toolbar">
    <button id="btnNew">新規</button>
    <button id="btnOpen">開く</button>
    <button id="btnSave">保存</button>
    <button id="btnCopy">コピー</button>
    <button id="btnCut">カット</button>
    <button id="btnPaste">ペースト</button>
    <button id="btnSearch" type="button" aria-label="検索">🔍</button>
    <button id="btnNewlineToggle" type="button" aria-label="改行コード表示" aria-pressed="true" title="改行コード表示: ON">↲</button>
    <button id="btnBlockMode" type="button" aria-label="ブロック表示モード レベル0" aria-pressed="false" title="ブロック表示モード: 0">📖0</button>
    <button id="btnOutlineToggle" type="button" aria-label="&#x76EE;&#x6B21;&#x3092;&#x975E;&#x8868;&#x793A;" aria-pressed="true">&#x1F5C4;&#xFE0F;</button>
    <button id="btnAbout" type="button" aria-label="&#x30D8;&#x30EB;&#x30D7;">&#xFF1F;</button>
    <button id="btnFontSize">文字サイズ: 20px</button>
    <label class="theme-toggle" title="表示モード">
      <span aria-hidden="true">☀️</span>
      <input id="themeToggle" type="checkbox" role="switch" aria-label="ダークテーマ">
      <span aria-hidden="true">🌙</span>
    </label>
    <span id="fileNameDisplay">無題.txt</span>
  </div>
  <section id="searchPanel" role="search" aria-label="検索" hidden>
    <div class="searchRow">
      <label for="searchInput">検索ワード</label>
    <input id="searchInput" type="search" autocomplete="off">
      <button id="searchPrevious" type="button">↑前検索</button>
    </div>
    <div class="searchRow">
      <label for="replaceInput">置換ワード</label>
      <input id="replaceInput" type="text" autocomplete="off">
      <button id="searchNext" type="button">↓次検索</button>
    </div>
    <div class="searchActions">
      <button id="replaceCurrent" type="button">置換実行</button>
      <button id="searchClose" type="button">キャンセル</button>
    </div>
    <div id="searchMessage" role="status" aria-live="polite"></div>
  </section>
  <div id="spacer"></div>

  <div id="mainArea">
    <div id="outlineArea"><div id="outlineEmpty">見出し（# ）がここに表示されます</div></div>

    <div id="editorWrapper">
      <div id="currentLineLayer"></div>
      <div id="lineNumberLayer" aria-hidden="true"></div>
      <div id="highlightLayer" class="editorFont"></div>
      <div id="newlineLayer" class="editorFont" aria-hidden="true"></div>
      <div id="caretMirror" class="editorFont"></div>
      <textarea id="editorTextarea" class="editorFont" spellcheck="false"></textarea>
      <div id="selectionCaret" aria-hidden="true"></div>
    </div>
    <div id="statusBar" role="group" aria-label="文書ステータス">
      <span id="statusLineCount"></span>
      <span id="statusCharacterCount"></span>
      <span id="statusCursor"></span>
      <span id="statusFileSize"></span>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".txt,.md" style="display:none;">

  <div id="modalOverlay">
    <div id="modalBox">
      <div id="modalMessage"></div>
      <div id="modalButtons">
        <button id="modalCancel">キャンセル</button>
        <button id="modalAlt" hidden></button>
        <button id="modalOk">OK</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <div id="helpOverlay" class="helpOverlay" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="helpBox">
      <div class="helpHeader">
        <h2 id="helpTitle">&#x30D8;&#x30EB;&#x30D7;</h2>
        <button id="helpClose" type="button">&#x9589;&#x3058;&#x308B;</button>
      </div>
      <iframe id="helpFrame" src="./help.html" title="UME Neo &#x30D8;&#x30EB;&#x30D7;"></iframe>
    </div>
  </div>

<script type="module" src="/main.ts"></script>
</body>
</html>
